# Render blueprint for hosting CrossTalk on the free plan. Steps: docs/DEPLOY.md.
# Secrets are marked sync: false, so Render asks for them in its dashboard. They never live in this repo.
services:
  - type: web
    name: crosstalk
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build && bash scripts/install-litestream.sh
    # Brings back saved episodes from the backup (when set up), then keeps backing up while it runs.
    startCommand: bash scripts/start.sh
    healthCheckPath: /api/access
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # The code you type once on each device, at least 8 characters. Only asked for with real models
      # (PROVIDER_MODE=openrouter); mock mode stays open.
      - key: ACCESS_CODE
        sync: false
      # Starts in mock mode, which needs no key. Switch to openrouter in the dashboard when ready.
      - key: PROVIDER_MODE
        value: mock
      - key: MAX_REQUESTS_PER_DAY
        value: "40"
      # The Scout runs at SCOUT_TIME in this time zone.
      - key: TZ
        value: America/New_York
      - key: SCOUT_TIME
        value: "07:00"
      # Keep episodes for good (optional, free): a private Backblaze B2 bucket. Steps: docs/DEPLOY.md.
      # Without these, the app still works but forgets everything on restart.
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_ENDPOINT
        sync: false
      - key: BACKUP_REGION
        sync: false
      - key: BACKUP_KEY_ID
        sync: false
      - key: BACKUP_SECRET
        sync: false

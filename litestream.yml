# Litestream copies the database (episodes, transcripts and Iris's sketches) to S3-compatible storage
# as it changes. Every value comes from the environment; nothing secret lives here. See docs/DEPLOY.md.
dbs:
  - path: ${DB_PATH}
    replicas:
      - type: s3
        bucket: ${BACKUP_BUCKET}
        path: crosstalk
        endpoint: ${BACKUP_ENDPOINT}
        region: ${BACKUP_REGION}
        access-key-id: ${BACKUP_KEY_ID}
        secret-access-key: ${BACKUP_SECRET}
        # One upload a minute at most, and a fresh full copy every hour, so bringing the episodes back
        # after a restart reads one copy plus under an hour of changes, not days of them. That keeps
        # Backblaze's free daily request allowance (2,500) out of reach.
        sync-interval: 1m
        snapshot-interval: 1h
        retention: 24h
